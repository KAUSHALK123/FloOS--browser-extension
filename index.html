<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>floOS | Mechanical Dashboard</title>

  <!-- Lucide Icons (CDN – safe to keep for now) -->
  

  <!-- CSS (keep inline or move to file later) -->
  <link rel="stylesheet" href="styles/style.css" />
</head>

<body>
  <div class="bg"></div>

  <!-- DELETE DROP ZONE (appears when dragging tasks) -->
  <div id="deleteDropZone" class="delete-drop-zone hidden">
    <div class="dustbin-icon">🗑️</div>
    <div class="dustbin-text">Drop here to delete</div>
  </div>

  <!-- TOP CATEGORY NAV -->
  <div class="category-nav">
    <div class="glass-radio-group">
      <input type="radio" name="category" id="glass-home" data-cat="dial" checked />
      <label for="glass-home">Home</label>

      <input type="radio" name="category" id="glass-social" data-cat="social" />
      <label for="glass-social">Social</label>

      <input type="radio" name="category" id="glass-work" data-cat="work" />
      <label for="glass-work">Work</label>

      <input type="radio" name="category" id="glass-notes" data-cat="notes" />
      <label for="glass-notes">Notes</label>

      <div class="glass-glider"></div>
    </div>
    
    <div class="bubble plus-btn" id="addBookmarkBtn">+</div>
    <div class="bubble plus-btn hidden add-note-btn" id="addNoteBtn">+ Add Note</div>
  </div>

  <!-- MAIN LAYOUT -->
  <main class="glass-container">

    <!-- LEFT PANEL -->
    <section class="panel left-panel">
      <button id="leftFlipToggle" class="flip-btn" title="Show tasks" aria-label="Flip">⤾</button>
      <div class="flip-inner" id="leftFlipInner">
        <div class="front">
          <h1 id="time" style="font-size:48px;color:var(--primary-glow);">00:00</h1>

          <div class="calendar glass-inner" id="calendarBox">
            <div class="calendar-title" id="calendarTitle"></div>
            <div class="calendar-header">
              <button id="prevMonth">◀</button>
              <span id="monthLabel"></span>
              <button id="nextMonth">▶</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
          </div>
        </div>
        <div class="back">
          <div class="calendar-header">
            <span id="monthLabelBack"></span>
          </div>
          <div class="month-tasks" id="monthTasks"></div>
        </div>
      </div>
    </section>

    <!-- CENTER PANEL -->
    <section class="center-panel">
      <div id="mainDial">
        <div class="dial-ring"></div>
        <div id="orbitWrapper">
          <div id="orbitItems"></div>
        </div>
      </div>

      <!-- NOTES GRID VIEW -->
      <div id="notesGrid" class="notes-grid hidden"></div>

      <div id="miniCard"></div>
    </section>

    <!-- RIGHT PANEL -->
    <section class="panel right-panel">
      <div class="right-panel-header">
        <p style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--primary-glow);margin:0;">
          Agent FloOs
        </p>
        <div style="display: flex; gap: 8px; align-items: center;">
          <div class="switch-container">
            <input class="toggle-checkbox" id="toggle-switch" type="checkbox" />
            <label class="switch" for="toggle-switch">
              <div class="toggle">
                <div class="led"></div>
              </div>
            </label>
          </div>
          <button id="settingsBtn" class="settings-icon-btn" title="Settings">
            ⚙
          </button>
        </div>
      </div>

      <div class="chat-area" id="chatArea">
        <div class="tasks-title">
          <span style="font-size:11px;opacity:0.7;text-transform:uppercase;letter-spacing:1px;">Your Tasks</span>
        </div>
        <div id="tasksList" class="tasks-list"></div>
      </div>

      <input class="chat-input" id="quickTaskInput" type="text" placeholder="Quick add task (press Enter)..." />
    </section>

  </main>

 


  <!-- CALENDAR TASK MODAL -->
  <div id="calendarModal" class="task-modal hidden">
    <div class="task-glass">
      <h3 id="modalDateTitle">Add Task</h3>

      <input id="taskSubject" placeholder="Subject *" />
      <textarea id="taskDescription" placeholder="Description"></textarea>
      <input id="taskLink" placeholder="Link (optional)" />

      <div class="modal-actions">
        <button id="cancelModal">Cancel</button>
        <button id="saveModal">Save</button>
      </div>
    </div>
  </div>
  <!-- Scripts (module to support imports) -->
  <script type="module" src="scripts/app.js"></script>
</body>
</html>
