<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>floOS | Mechanical Dashboard</title>

  <!-- Lucide Icons (CDN – safe to keep for now) -->
  

  <!-- CSS (keep inline or move to file later) -->
  <link rel="stylesheet" href="styles/style.css" />
</head>

<body>
  <div class="bg"></div>

  <!-- DELETE DROP ZONE (appears when dragging tasks) -->
  <div id="deleteDropZone" class="delete-drop-zone hidden">
    <div class="dustbin-icon">🗑️</div>
    <div class="dustbin-text">Drop here to delete</div>
  </div>

  <!-- TOP CATEGORY NAV -->
  <div class="category-nav">
    <div class="glass-radio-group">
      <input type="radio" name="category" id="glass-home" data-cat="dial" checked />
      <label for="glass-home">Home</label>

      <input type="radio" name="category" id="glass-social" data-cat="social" />
      <label for="glass-social">Social</label>

      <input type="radio" name="category" id="glass-work" data-cat="work" />
      <label for="glass-work">Work</label>

      <input type="radio" name="category" id="glass-notes" data-cat="notes" />
      <label for="glass-notes">Notes</label>

      <div class="glass-glider"></div>
    </div>
    
    <div class="bubble plus-btn" id="addBookmarkBtn">+</div>
    <div class="bubble plus-btn hidden add-note-btn" id="addNoteBtn">+</div>
  </div>

  <!-- MAIN LAYOUT -->
  <main class="glass-container">

    <!-- LEFT PANEL -->
    <section class="panel left-panel">
      <button id="leftFlipToggle" class="flip-btn" title="Show tasks" aria-label="Flip">⤾</button>
      <div class="flip-inner" id="leftFlipInner">
        <div class="front">
          <h1 id="time" style="font-size:48px;color:var(--primary-glow);">00:00</h1>

          <div class="calendar glass-inner" id="calendarBox">
            <div class="calendar-title" id="calendarTitle"></div>
            <div class="calendar-header">
              <button id="prevMonth">◀</button>
              <span id="monthLabel"></span>
              <button id="nextMonth">▶</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
          </div>

          <button class="btn" id="vaultUnlockBtn">
            <div class="fabric"></div>
            <span class="txt">Vault</span>
            <span class="txt">Unlock</span>
            <div class="shadow left"></div>
            <div class="shadow right"></div>
            <div class="dot"></div>
            <div class="light"></div>
          </button>

          <svg class="filter">
            <filter id="bump">
              <feTurbulence result="noise" numOctaves="4" baseFrequency="0.678" type="fractalNoise"></feTurbulence>
              <feSpecularLighting result="specular" lighting-color="#fffffa" specularExponent="15" specularConstant="0.7" surfaceScale="0.22" in="noise">
                <fePointLight z="210" y="-50" x="40"></fePointLight>
              </feSpecularLighting>
              <feComposite result="noise2" operator="in" in="specular" in2="SourceGraphic"></feComposite>
              <feBlend mode="difference" in2="noise2" in="SourceGraphic" result="out"></feBlend>
              <feBlend mode="overlay" in2="out" in="SourceGraphic"></feBlend>
            </filter>
          </svg>

          <svg class="filter">
            <defs>
              <filter id="linen">
                <feTurbulence type="fractalNoise" baseFrequency="0.9 0.03" numOctaves="2" seed="8" result="verticalNoise"></feTurbulence>
                <feTurbulence type="fractalNoise" baseFrequency="0.03 0.9" numOctaves="2" seed="12" result="horizontalNoise"></feTurbulence>
                <feBlend in="verticalNoise" in2="horizontalNoise" mode="multiply" result="woven"></feBlend>
                <feComponentTransfer in="woven" result="threadContrast">
                  <feFuncR type="gamma" amplitude="1.3" exponent="2.4"></feFuncR>
                  <feFuncG type="gamma" amplitude="1.3" exponent="2.4"></feFuncG>
                  <feFuncB type="gamma" amplitude="1.3" exponent="2.4"></feFuncB>
                </feComponentTransfer>
                <feGaussianBlur in="threadContrast" stdDeviation="0.22" result="softThreads"></feGaussianBlur>
                <feComposite in="softThreads" in2="SourceGraphic" operator="in" result="textureMask"></feComposite>
                <feBlend in="SourceGraphic" in2="textureMask" mode="color-burn"></feBlend>
              </filter>
            </defs>
          </svg>
        </div>
        <div class="back">
          <div class="calendar-header">
            <span id="monthLabelBack"></span>
          </div>
          <div class="month-tasks" id="monthTasks"></div>
        </div>
      </div>
    </section>

    <!-- CENTER PANEL -->
    <section class="center-panel">
      <div id="mainDial">
        <div class="dial-ring"></div>
        <div id="orbitWrapper">
          <div id="orbitItems"></div>
        </div>
      </div>

      <!-- NOTES GRID VIEW -->
      <div id="notesGrid" class="notes-grid hidden"></div>

      <div id="miniCard"></div>
    </section>

    <!-- RIGHT PANEL -->
    <section class="panel right-panel">
      <div class="right-panel-header">
        <p style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--primary-glow);margin:0;">
          Agent FloOs
        </p>
        <div style="display: flex; gap: 8px; align-items: center;">
          <div class="switch-container">
            <input class="toggle-checkbox" id="toggle-switch" type="checkbox" />
            <label class="switch" for="toggle-switch">
              <div class="toggle">
                <div class="led"></div>
              </div>
            </label>
          </div>
          <button id="settingsBtn" class="settings-icon-btn" title="Settings">
            ⚙
          </button>
        </div>
      </div>

      <div class="chat-area" id="chatArea">
        <div class="tasks-title">
          <span style="font-size:11px;opacity:0.7;text-transform:uppercase;letter-spacing:1px;">Your Tasks</span>
        </div>
        <div id="tasksList" class="tasks-list"></div>
      </div>

      <input class="chat-input" id="quickTaskInput" type="text" placeholder="Quick add task (press Enter)..." />
    </section>

  </main>

 


  <!-- CALENDAR TASK MODAL -->
  <div id="calendarModal" class="task-modal hidden">
    <div class="task-glass">
      <h3 id="modalDateTitle">Add Task</h3>

      <input id="taskSubject" placeholder="Subject *" />
      <textarea id="taskDescription" placeholder="Description"></textarea>
      <input id="taskLink" placeholder="Link (optional)" />

      <div class="modal-actions">
        <button id="cancelModal">Cancel</button>
        <button id="saveModal">Save</button>
      </div>
    </div>
  </div>

  <!-- VAULT OVERLAY MODAL -->
  <div id="vaultOverlay" class="vault-overlay hidden">
    <button class="vault-close-btn" id="vaultCloseBtn">&times;</button>
    
    <!-- Title loadout/loading animation screen -->
    <div class="vault-loadout-screen" id="vaultLoadoutScreen">
      <div class="uiverse-title-pattern">
        <div class="bg-glow"></div>
        <div class="bg-noise"></div>
        <div class="dust-layer"></div>

        <div class="doodle-layer">
          <div class="doodle spark d1" style="top: 15%; left: 20%;"></div>
          <div class="doodle scratch d2" style="top: 75%; left: 80%;"></div>
          <div class="doodle dot d3" style="top: 25%; left: 75%;"></div>
          <div class="doodle spark d4" style="top: 80%; left: 25%;"></div>
          <div class="doodle scratch d5" style="top: 45%; left: 10%;"></div>
          <div class="doodle dot d6" style="top: 55%; left: 90%;"></div>
        </div>

        <div class="title-stage">
          <div class="neon-line top-line">
            <div class="neon-line-inner"></div>
          </div>

          <div class="main-title">
            <span class="letter" data-char="S" style="--x: -8rem; --y: -7rem; --r: -45deg; --d: 0.1s;">S</span>
            <span class="letter" data-char="A" style="--x: -4rem; --y: 8rem; --r: 30deg; --d: 0.4s;">A</span>
            <span class="letter" data-char="V" style="--x: 0rem; --y: -9rem; --r: -15deg; --d: 0.2s;">V</span>
            <span class="letter" data-char="A" style="--x: 4rem; --y: 7rem; --r: 60deg; --d: 0.6s;">A</span>
            <span class="letter" data-char="G" style="--x: 7rem; --y: -5rem; --r: -25deg; --d: 0.3s;">G</span>
            <span class="letter" data-char="E" style="--x: 5rem; --y: 9rem; --r: 40deg; --d: 0.7s;">E</span>
          </div>

          <div class="sub-title">
            <span class="letter" data-char="V" style="--x: -6rem; --y: 5rem; --r: 20deg; --d: 0.8s;">V</span>
            <span class="letter" data-char="A" style="--x: -4rem; --y: -4rem; --r: -30deg; --d: 1.1s;">A</span>
            <span class="letter" data-char="U" style="--x: -1rem; --y: 6rem; --r: 45deg; --d: 0.9s;">U</span>
            <span class="letter" data-char="L" style="--x: 2rem; --y: -6rem; --r: -15deg; --d: 1.3s;">L</span>
            <span class="letter" data-char="T" style="--x: 4rem; --y: 5rem; --r: 35deg; --d: 1.0s;">T</span>
          </div>

          <div class="neon-line bottom-line">
            <div class="neon-line-inner"></div>
          </div>

          <div class="caption">FIND THE PASSWORD</div>
        </div>
      </div>

      <!-- Password prompt overlay -->
      <div class="vault-prompt-container">
        <h2 id="vaultPromptTitle">VAULT SECURED</h2>
        <input type="password" class="input vault-password-input" id="vaultPasswordInput" placeholder="Password..." />
      </div>
    </div>

    <!-- Decrypted view / Vault dashboard -->
    <div class="vault-dashboard hidden" id="vaultDashboard">
      <div class="vault-header">
        <h2>SAVAGE VAULT</h2>
        <button class="vault-btn add-secret-btn-top" id="addSecretBtn">+ Add Secret</button>
      </div>

      <div class="vault-secrets-grid" id="vaultSecretsGrid">
        <!-- Dynamic secrets cards -->
      </div>
    </div>
  </div>

  <!-- ADD/EDIT SECRET MODAL -->
  <div id="secretModal" class="task-modal hidden">
    <div class="task-glass">
      <h3 id="secretModalTitle">New Secret</h3>
      <input id="secretTitle" placeholder="Title/Website *" />
      <input id="secretUsername" placeholder="Username/Email" />
      <div style="position: relative; display: flex; align-items: center;">
        <input id="secretValue" type="password" placeholder="Secret/Password *" style="flex: 1;" />
        <button id="toggleSecretVisibilityBtn" style="position: absolute; right: 10px; background: none; border: none; color: var(--primary-glow); cursor: pointer;">👁️</button>
      </div>
      <div class="modal-actions">
        <button id="cancelSecretModal">Cancel</button>
        <button id="saveSecret">Save</button>
      </div>
    </div>
  </div>

  <!-- Scripts (module to support imports) -->
  <script type="module" src="scripts/app.js"></script>
</body>
</html>
